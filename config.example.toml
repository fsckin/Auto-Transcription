[paths]
mount_point = "/Volumes/IC RECORDER"
recorder_subdir = "REC_FILE"
# Discover the active vault from Obsidian's local registry. A concrete path or
# --vault always overrides discovery.
vault = "auto"
recordings_folder = "Recordings"
state_root = "~/Library/Application Support/AutoTranscription"
attachments_folder = "Recordings/Audio"
# Optional. On first successful mount the script records the actual UUID and
# refuses a different volume at the same path thereafter.
recorder_volume_uuid = ""

[import]
archive_audio = true
copy_audio_to_vault = false
stable_wait_seconds = 1.0
stable_check_count = 3
readiness_probe_seconds = 1.0
retry_count = 2
copy_timeout_seconds = 1800
retry_base_seconds = 300
retry_max_seconds = 21600
keep_audio = true
discard_after_days = 0
# Generated orphan state is retained briefly; failed audio is never deleted
# automatically unless failed_retention_days is explicitly set above zero.
orphan_retention_days = 7
failed_retention_days = 0

[transcription]
backend = "auto"
# Low-memory/fast default. Use --maximum-accuracy explicitly for large-v3.
model = "small"
retry_model = "small"
hybrid_retry = false
confidence_threshold = -0.80
language = "en"
initial_prompt = ""
word_timestamps = false
# Prevent one bad 30-second window from feeding a hallucinated phrase into the
# rest of the recording. Unresolved high-compression loops are removed.
condition_on_previous_text = false
compression_ratio_threshold = 2.4
no_speech_threshold = 0.6
vad_enabled = true
vad_noise_db = -40.0
vad_min_silence_seconds = 1.0
vad_padding_seconds = 0.25
# Optional FFmpeg audio filter. Leave empty unless testing proves it helps.
audio_filter = ""
# A blank transcript with measurable audio gets exactly one recovery pass with
# VAD disabled, voice normalization, and this more accurate model.
no_text_retry_model = "medium"
no_text_retry_filter = "highpass=f=80,dynaudnorm=f=150:g=15"
# Only peaks at or below this conservative threshold are classified as silent.
silence_peak_db = -50.0
quality_active_db = -45.0
min_active_audio_seconds = 0.15
clipping_peak_db = -0.1
device = "auto"
# Long audio is decoded and transcribed one bounded chunk at a time. These
# defaults keep peak memory predictable on a 16 GB Apple Silicon Mac.
chunk_seconds = 900.0
chunk_overlap_seconds = 2.0
max_direct_seconds = 900.0
# Applied to each bounded chunk, not the entire multi-hour recording.
timeout_seconds = 14400

[diarization]
# "auto" adds Person 1 / Person 2 turns when both model files are installed,
# and otherwise continues normally. Use "on" to treat missing models as an error
# or "off" to disable speaker detection.
mode = "auto"
# model_dir = "~/Library/Application Support/AutoTranscription/Models/Diarization"
# - sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx
# - nemo_en_titanet_small.onnx
# A known count bypasses threshold guessing, which can badly over-cluster long
# recordings. Set this to -1 only when the speaker count is truly unknown.
num_speakers = 2
cluster_threshold = 0.5
# One CPU thread plus the application's nice=20 keeps this background-friendly.
threads = 1
timeout_seconds = 14400

[summarization]
enabled = true
model = "mistral"
ollama_url = "http://127.0.0.1:11434"
chunk_chars = 24000
timeout_seconds = 600
retry_count = 3
prompt = ""
# Retained only while summarizing one recording; the model is explicitly unloaded afterward.
keep_alive = "2m"
# If the local API is unavailable, start `ollama serve` and wait this long.
startup_timeout_seconds = 30

[output]
# template = "~/path/to/custom-note-template.md"
generate_title = false

[behavior]
notify = true
prevent_sleep = true
# After the same non-dry-run `run` finds new files and finishes with zero
# failures, unmount the recorder volume. Empty polls always leave it mounted.
unmount_on_success = true
# 20 is macOS's lowest CPU scheduling priority; child processes inherit it.
nice_level = 20
log_max_bytes = 2000000
log_backups = 3
database_backups = 5

[corrections]
# "frequent mistranscription" = "preferred spelling"
